openapi: 3.1.0
info:
  title: Lunar Landing Site Navigator API
  version: 0.1.0
  description: Shared REST contracts (Contracts A-E) for solar illumination, DTE comms, and local_enu terrain.
paths:
  /api/v1/health:
    get:
      summary: Service health check
      responses:
        "200":
          description: Healthy API status
  /api/v1/sites:
    get:
      summary: Contract A - List curated lunar landing sites
      responses:
        "200":
          description: Array of SiteSummary objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSummary"
  /api/v1/sites/{site_id}/terrain:
    get:
      summary: Contract C - Fetch local_enu terrain patch for curated site
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local ENU terrain patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainPatch"
  /api/v1/terrain/custom:
    post:
      summary: Contract C - Compute local_enu terrain patch for arbitrary coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomTerrainRequest"
      responses:
        "200":
          description: Local ENU terrain patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainPatch"
  /api/v1/evaluate:
    post:
      summary: Contract B - Evaluate solar illumination, DTE comms, countdowns, and score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: Scenario evaluation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
  /api/v1/compare:
    post:
      summary: Contract D - Compare 2-4 scenarios side-by-side or across launch shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
      responses:
        "200":
          description: Multi-scenario comparison response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResponse"
  /api/v1/windows:
    post:
      summary: Contract E - Scan 12-month optimal landing windows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WindowsRequest"
      responses:
        "200":
          description: 12-month window heatmap response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsResponse"
components:
  schemas:
    SiteSummary:
      type: object
      required: [id, name, category, agency, lat_deg, lon_deg, elevation_m, mean_slope_deg, has_precomputed_terrain, summary, external_links]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        agency: { type: string }
        lat_deg: { type: number }
        lon_deg: { type: number }
        elevation_m: { type: number }
        mean_slope_deg: { type: number }
        has_precomputed_terrain: { type: boolean }
        summary: { type: string }
        external_links: { type: object }
    CustomTerrainRequest:
      type: object
      required: [lat_deg, lon_deg]
      properties:
        lat_deg: { type: number }
        lon_deg: { type: number }
        label: { type: string, nullable: true }
    TerrainPatch:
      type: object
      required: [site_id, frame, grid_size, patch_radius_km, center_elevation_m, min_elevation_m, max_elevation_m, elevations_m_flat, slopes_deg_flat, psr_mask_flat]
      properties:
        site_id: { type: string }
        frame: { type: string, enum: [local_enu] }
        grid_size: { type: integer }
        patch_radius_km: { type: number }
        center_elevation_m: { type: number }
        min_elevation_m: { type: number }
        max_elevation_m: { type: number }
        elevations_m_flat: { type: array, items: { type: number } }
        slopes_deg_flat: { type: array, items: { type: number } }
        psr_mask_flat: { type: array, items: { type: integer } }
    EvaluateRequest:
      type: object
      required: [start_utc, duration_days]
      properties:
        site_id: { type: string, nullable: true }
        custom_coords: { type: object, nullable: true }
        start_utc: { type: string, format: date-time }
        duration_days: { type: number }
        step_minutes: { type: integer, default: 60 }
        solar_array_type: { type: string, enum: [horizontal_fixed, vertical_fixed, vertical_tracking], default: vertical_tracking }
        observer_height_m: { type: number, default: 2.0 }
        min_comms_elev_deg: { type: number, default: 5.0 }
    EvaluateResponse:
      type: object
      required: [site, summary, horizon_profile, timeseries]
      properties:
        site: { type: object }
        summary: { type: object }
        horizon_profile: { type: array, items: { type: object } }
        timeseries: { type: array, items: { type: object } }
    CompareRequest:
      type: object
      required: [scenarios]
      properties:
        baseline_index: { type: integer, default: 0 }
        scenarios: { type: array, items: { type: object } }
    CompareResponse:
      type: object
      required: [baseline_index, scenarios, recommended_scenario_id]
      properties:
        baseline_index: { type: integer }
        scenarios: { type: array, items: { type: object } }
        recommended_scenario_id: { type: string }
    WindowsRequest:
      type: object
      required: [site_id, mission_duration_days]
      properties:
        site_id: { type: string }
        year: { type: integer, default: 2027 }
        mission_duration_days: { type: integer }
        solar_array_type: { type: string, default: vertical_tracking }
    WindowsResponse:
      type: object
      required: [site_id, mission_duration_days, solar_array_type, windows, top_windows]
      properties:
        site_id: { type: string }
        mission_duration_days: { type: integer }
        solar_array_type: { type: string }
        windows: { type: array, items: { type: object } }
        top_windows: { type: array, items: { type: object } }

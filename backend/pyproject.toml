[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunar-landing-navigator-backend"
version = "0.1.0"
description = "Clean-architecture Python workspace for Lunar Landing Site Navigator"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
